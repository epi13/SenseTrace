host:
  name: worker-03
  role: dedicated_experiment_host

experiment:
  name: latent-system-state-worker03
  description: Causal multichannel system-state witnesses and matched-state divergence.
  seed: 20260913

# The historical validators still require this inert contract.  The campaign
# below is a new namespace and does not rewrite prior controlled-forecast data.
acquisition:
  backend: commodity
  enabled: false

phase1a:
  campaign_intent: measurement_characterization
  protocol_version: phase1a-commodity-baseline-v1
  measurement_primitive: commodity-clflush-timed-load
  location_count: 1
  trials_per_location: 4
  labels_per_location: 2
  samples: 4
  trace_length: 4
  pattern: random_word
  target_bit: 0
  word_count: 8192
  lock_memory: true
  cache_control: eviction_buffer
  eviction_bytes: 4194304
  operation: memory_read
  timing_perturbation_cycles: 0
  timing_perturbation_label: 1
  use_native_kernel: true
  require_native_kernel: true
  session_count: 1

latent_system_state:
  protocol_version: latent-system-state-v1
  stage: development
  # Development chooses a bounded witness/model/timescale subset.  The
  # confirmation invocation uses a separate output and a fresh seed namespace.
  sessions_per_cell: 6
  confirmation_sessions_per_cell: 20
  timescale_sweep_sessions_per_cell: 2
  trajectories_per_session: 1
  baseline_repetitions: 8
  excitation_length: 4
  repetitions_per_phase: 4
  quiet_future_repetitions: 24
  future_block_length: 4
  history_length: 8
  sampling_interval_us: 100
  phase_duration_us: 500
  word_count: 8192
  eviction_bytes: 4194304
  measurement_cpu_affinity: [0]
  excitation_cores: [2, 3, 4, 5, 6]
  lock_memory: true
  instrumentation_tier: 1
  # Tier 1 is intentionally restricted to the native CPU identity witness;
  # proc/scheduler/frequency witnesses are Tier 2 mechanism witnesses because
  # their per-block reads are measured below.
  tier1_local_channels: [tsc_aux]
  pmu_scope: origin_only
  witness_scope: origin_only
  # These are generic thread-scoped events on worker-03.  Any permission,
  # encoding, or multiplexing failure remains invalid rather than zero.
  pmu_events: [cache-references, cache-misses]
  origin_probe_conditions: [cached_preloaded, timer_only, clflush, eviction]
  target_conditions: [cached_preloaded, timer_only]
  excitation_families: [read_pressure, active_quiet, sham, passive]
  horizons: [1, 4, 8]
  state_rank: 2
  ridge_alpha: 1.0
  match_tolerance_ticks: 8
  max_reported_matches: 200
  primary:
    excitation_family: read_pressure
    measurement_condition: cached_preloaded
    target: future_block_mean
    horizon: 8
    comparison: current_primary_vs_current_multichannel
  observer_characterization_repetitions: 128
  observer_effect:
    max_wall_latency_ratio: 2.0
    max_timing_variance_ratio: 2.0
    max_timing_median_shift_ticks: 20
    max_thread_cpu_utilization: 0.25
  development_timescales_us: [50, 100, 1000]

splits:
  primary:
    group_keys: [session_id]
    train_fraction: 0.60
    validation_fraction: 0.20
    test_fraction: 0.20

training:
  enabled_during_acquisition: false
  device_preference: cpu

reporting:
  ci_unit: session_id
  bootstrap_repetitions: 500
  practical_effect_threshold_ticks2: 1.0

run_metadata:
  node: worker-03
  confirmation_policy: fresh output, fresh session IDs, fresh schedule seeds, fresh allocations, no retuning
  witness_role: Tier 1 causal candidates plus Tier 2 mechanism witnesses when available
  claim_boundary: ordinary timing/system-state prediction; no hidden DRAM-state or unique-mechanism claim
