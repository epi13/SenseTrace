experiment:
  name: phase0-pipeline-controls
  description: Validate SenseTrace acquisition, splitting, training, and metrics before interpreting DRAM measurements.
  seed: 1337

data:
  target_balance: 0.50
  samples: 100000
  trace_channels: 1
  trace_length: 2048
  sample_rate_hz: null

controls:
  synthetic_null:
    enabled: true
    expected_balanced_accuracy: 0.50
  injected_weak_signal:
    enabled: true
    amplitude_sigma: 0.10
    levels: [0.0, 0.01, 0.025, 0.05, 0.10, 0.20]
    start_index: 800
    width: 32
  shuffled_labels:
    enabled: true
    expected_balanced_accuracy: 0.50

splits:
  primary:
    strategy: grouped
    group_keys:
      - synthetic_dataset_id
      - synthetic_session_id
      - synthetic_location_id
    train_fraction: 0.70
    validation_fraction: 0.15
    test_fraction: 0.15
  prohibit_identity_features: true

models:
  logistic_regression:
    enabled: true
  boosted_trees:
    enabled: true
  tiny_mlp:
    enabled: false
  tiny_cnn:
    enabled: false
    channels: [16, 32, 32, 64]
    kernels: [11, 7, 5, 3]
    dense_width: 32
    target_parameter_budget: 50000

training:
  objective: binary_cross_entropy
  batch_size: 256
  epochs: 30
  early_stopping_patience: 5
  seeds: [11, 23, 37, 53, 71]

reporting:
  ci_unit: session_id
  bootstrap_repetitions: 400
  metrics:
    - balanced_accuracy
    - auroc
    - confusion_matrix
  report_parameter_count: true
  report_class_balance: true
  report_confidence_interval: true
  report_repeated_run_variance: true
  require_negative_controls: true

acquisition:
  backend: synthetic
  synthetic_balance_mode: group_stratified_balance
  observations_per_location: 4
  session_count: 4
  device_count: 2
  shard_target_mb: 512

calibration:
  protocol_version: phase0-protocol-v1
  samples: 1000
  trace_length: 128
  injected_levels: [0.05, 0.10, 0.20]
  alpha: 0.05
  null_replicates: 50
  shuffled_replicates: 50
  injected_replicates: 50
  gate_validation_replicates: 50
  minimum_injected_detection_rate: 0.80
  permutation_repetitions: 100
  permutation_model: logistic_regression
  permutation_strata_by_balance_mode:
    global_balance_only: [synthetic_dataset_id]
    group_stratified_balance: [synthetic_location_id]
  balance_modes: [global_balance_only, group_stratified_balance]
