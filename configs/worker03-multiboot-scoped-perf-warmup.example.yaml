# Frozen warmup-repeat multi-boot scoped-PMU characterization (multiboot-v2).
#
# FROZEN BEFORE EVIDENCE COLLECTION. Do not retune thresholds, events,
# replicates, boots, warmup, or witness policy after seeing measurements.
# Any change requires a new protocol identity and hash.
#
# Motivation: the v1 genuine three-boot repeat reproduced the directional
# cached-vs-requested-CLFLUSH contrast 9/9 with no multiplexing, but null
# stability failed within and across boots. Post-hoc analysis characterized
# the instability as a first-use-of-allocation cold transient (order-0
# controls inflated 9/9). This is the single predeclared bounded follow-up:
# identical frozen null rule and decision tree, plus an explicit allocation
# warmup executed outside any PMU window before the randomized control order.
#
# Design: repeat the small scoped-PMU characterization (3 replicates x 4
# locations x 16 trials, 64 ops per control) across 3 genuinely distinct OS
# boots. Candidate event is a single predeclared value, cpu/cache-misses/;
# cpu/cache-references/ is diagnostic-only and cannot satisfy this gate.
# Null rule: max relative deviation <= 0.25, max relative MAD <= 0.10,
# minimum 3 complete finite replicates per boot; cross-boot stability pools
# all 9 null replicate medians under the same rule.
#
# Warmup (frozen): touch every word of the fresh shared allocation with a
# fixed seed-independent pattern plus 64 native cached dummy loads, all
# outside any operation-scoped perf window. Identical for every control in
# a replicate. Provenance retained per replicate and hashed into the protocol.
#
# Witness policy (frozen): disabled for this PMU gate. Run the bounded eBPF
# pilot separately; it must not mutate this evidence.
#
# Decision tree (unchanged from v1):
#   A: 3/3 directional agreement in EVERY boot, no multiplexing, cross-boot
#      null stability passes, provenance complete (distinct genuine boot IDs,
#      protocol + warmup agreement) -> only then may a small hidden-bit pilot be considered.
#   B: directional contrast survives every boot but cross-boot stability fails
#      -> preserve B, do not increase hidden-bit N.
#   C: directional contrast fails in any boot or provenance incomplete
#      -> stop the commodity line, advance Phase 2.
host:
  name: worker-03
  role: dedicated_experiment_host

experiment:
  name: worker03-multiboot-scoped-perf-warmup-characterization
  description: Warmup-controlled repeat of the scoped PMU characterization across three genuine OS boots.
  seed: 20260904

data:
  target_balance: 0.50
  samples: 64
  trace_channels: 1
  trace_length: 32

acquisition:
  backend: commodity
  shard_target_mb: 1
  max_samples_per_shard: 64

phase1a:
  status: measurement_primitive_characterization
  protocol_version: phase1a-commodity-baseline-v1
  measurement_primitive: commodity-clflush-timed-load
  location_count: 4
  trials_per_location: 16
  labels_per_location: 8
  samples: 64
  trace_length: 32
  pattern: single_bit
  target_bit: 0
  word_count: 64
  lock_memory: false
  cache_control: clflush
  eviction_bytes: 1048576
  cpu_affinity: null
  use_native_kernel: true
  require_native_kernel: true

characterization:
  replicates: 3
  multiboot_boots: 3
  location_count: 4
  trials_per_location: 16
  trace_length: 32
  weak_positive_control_cycles: [0, 32, 64, 128]
  # Qualified sysfs identity is required for a CPU-specific event. The
  # uncore IMC event family is intentionally not selected: it is not
  # thread-scoped and cannot satisfy this primitive's declared boundary.
  scoped_perf_event: cpu/cache-misses/
  allocation_warmup:
    enabled: true
    touch_pages: true
    dummy_loads: 64

witness:
  requirement: disabled
  hooks: []
