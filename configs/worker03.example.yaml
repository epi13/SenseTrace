host:
  name: worker-03
  role: dedicated_experiment_host
  memory_gb: 32
  vram_gb: 2
  storage: hdd

experiment:
  name: worker03-unattended-runner
  description: Keep the appliance alive and ready for explicitly launched campaigns.
  seed: 1337

data:
  target_balance: 0.50
  samples: 100000
  trace_channels: 1
  trace_length: 2048

runner:
  unattended: true
  resume_on_boot: true
  journal_enabled: true
  verify_last_finalized_shard_on_startup: true
  quarantine_incomplete_shards: true
  mode: idle
  state_dir: /var/lib/sensetrace/state

acquisition:
  backend: synthetic
  enabled: false
  target_source: cryptographic_random
  target_balance: 0.50
  buffer_samples: 8192
  shard_target_mb: 512
  temporary_suffix: .tmp
  finalize_atomically: true
  checksum: sha256

phase1a:
  status: exploratory
  protocol_version: phase1a-commodity-baseline-v1
  measurement_primitive: commodity-clflush-timed-load
  location_count: 128
  trials_per_location: 64
  labels_per_location: 32
  samples: 8192
  trace_length: 32
  pattern: single_bit
  target_bit: 0
  word_count: 1024
  lock_memory: true
  cache_control: clflush
  eviction_bytes: 4194304
  cpu_affinity: null
  ci_unit: acquisition_block
  use_native_kernel: true
  require_native_kernel: true
  session_count: 4

storage:
  raw_dir: /var/lib/sensetrace/data/raw
  manifest_dir: /var/lib/sensetrace/data/manifests
  run_dir_template: "run-{run_id}"
  one_file_per_trace: false
  preserve_raw_traces: true

safety:
  minimum_free_gb: 20
  minimum_free_percent: 10
  use_controlled_memory_region: true
  document_actual_isolation_guarantee: true
  use_generated_random_patterns_only: true
  no_sensitive_memory_contents: true

telemetry:
  record_host_inventory: true
  record_kernel: true
  record_bios: true
  record_cpu: true
  record_dimm_spd: true
  record_memory_frequency: true
  record_memory_timings_when_available: true
  record_temperature: true
  record_voltage_when_available: true
  record_reboot_and_crash_events: true

feature_policy:
  prohibit_identity_features: true
  grouping_only_fields:
    - host_id
    - device_id
    - bank_id
    - row_id
    - cell_or_offset_id
    - session_id
    - trial_index

training:
  enabled_during_acquisition: false
  device_preference: cpu
  allow_gpu_if_available: true
  seeds: [11, 23, 37]

reporting:
  ci_unit: session_id
  bootstrap_repetitions: 400
  paired_repetitions: 2000

# Native timing sensitivity is a separately namespaced calibration. It must
# never be combined with the physical Phase 1A dataset or used as physical
# DRAM-state evidence.
native_sensitivity:
  protocol_version: native-sensitivity-protocol-v1
  session_count: 4
  development_magnitudes_cycles: [0, 32, 64, 128, 256, 512]
  development_replicates: 20
  validation_replicates: 20
  alpha: 0.05
  target_power: 0.80
